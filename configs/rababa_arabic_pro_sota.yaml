# rababa_arabic_pro_sota — Arabic diacritization tuned for SOTA DER.
#
# SOTA fixes:
#   - early_stopping_patience: 4 (lock in best epoch, prevent drift).
#   - AdaMuon + NorMuon (best optimizer variants from Hebrew A/B).
#
# NOTE: pretrain init disabled for now. The rababa_arabic_pretrain checkpoint
# uses dim=384 (smaller model); current supervised is dim=512. Size mismatch.
# Once rababa_arabic_pro_pretrain completes (ap-nDIP4apFFDCmHdX4MxA9DU running),
# re-enable init_from_pretrain: /checkpoints/rababa_arabic_pro_pretrain/run-001/best.pt

name: rababa_arabic_pro_sota
description: Arabic Pro — SOTA-tuned (pretrain init + early stopping + AdaMuon).
kind: rababa
tier: 1

data:
  module: tashkeela
  cleaner: arabic
  root: /datasets/arabic-combined

model:
  arch: modern
  dim: 512
  layers: 6
  heads: 8
  ff_dim: 2048
  dropout: 0.1
  max_len: 256
  batch_size: 32
  with_seg_head: true
  kv_heads: 2
  qk_norm: true
  norm_type: rmsnorm
  rope_base: 1000000.0
  ffn_type: moe
  moe:
    n_experts: 16
    expert_dim: 512
    top_k: 2
    shared_experts: 0

train:
  epochs: 20
  batch_size: 16
  learning_rate: 3.0e-4
  weight_decay: 0.01
  warmup_steps: 1000
  grad_clip: 1.0
  fp16: true
  label_smoothing: 0.1
  # ---- Pretrain init disabled (size mismatch with rababa_arabic_pretrain) ----
  # Re-enable once rababa_arabic_pro_pretrain completes.
  init_from_pretrain: null
  optimizer: muon
  muon_lr: 0.02
  muon_momentum: 0.95
  ns_steps: 5
  qk_clip_every: 50
  qk_clip_tau_init: 8.0
  qk_clip_tau_final: 1.0
  # ---- AdaMuon + NorMuon: best optimizer-side improvements ----
  adamuon_beta: 0.99
  normuon_enabled: true
  # ---- Early stopping ----
  early_stopping_patience: 4

eval:
  v0.5.0_max_der: 0.04
  v1.0.0_max_der: 0.025
  v1.5.0_max_der: 0.018
