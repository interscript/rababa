# rababa_hebrew_byt5_base — Hebrew diacritization via ByT5-Base fine-tuning.
#
# ByT5-small (300M) reached 17.07% DER — close to v0.1.0 (15%) but short of
# SOTA (~8%). ByT5-Base (580M) is recommended by arXiv:2603.28028 for complex
# character-level correction tasks. The TACL paper shows ByT5's quality gap
# over subword models widens at larger model sizes.
#
# Training is ~2x slower than ByT5-small (~8h on A10G).

name: rababa_hebrew_byt5_base
description: Hebrew diacritization via ByT5-Base fine-tuning
kind: rababa_hebrew
tier: 1

data:
  module: nakdimon
  cleaner: hebrew
  max_len: 512

model:
  arch: byt5_hebrew
  model_name: google/byt5-base
  max_len: 512

train:
  epochs: 15
  batch_size: 4
  learning_rate: 3.0e-4
  weight_decay: 0.01
  warmup_steps: 500
  grad_clip: 1.0
  label_smoothing: 0.1

eval:
  v0.1.0_max_der: 0.12
  v0.5.0_max_der: 0.08
  v1.0.0_max_der: 0.06
