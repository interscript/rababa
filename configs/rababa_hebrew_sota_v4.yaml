# rababa_hebrew_sota_v4 — Hebrew SOTA without pretrain init.
#
# v3 (with pretrain) had unstable early epochs (val=19→30→22→13→7.6).
# Pretrain init caused initial loss spike because random heads disrupt
# pretrained encoder weights.
#
# v4 tests: SOTA stack WITHOUT pretrain init. Should converge faster and
# more stably. Compare against v3 to determine if pretrain init is worth
# the instability cost.

name: rababa_hebrew_sota_v4
description: Hebrew SOTA v4 — class weights + focal + EMA + AdaMuon (no pretrain).
kind: rababa_hebrew
tier: 1

data:
  module: nakdimon
  cleaner: hebrew
  max_len: 200

model:
  arch: modern_multi_head
  dim: 384
  layers: 6
  heads: 6
  ff_dim: 1536
  dropout: 0.1
  max_len: 512
  batch_size: 32
  head_sizes: [16, 3, 4]
  kv_heads: 2
  qk_norm: true
  norm_type: rmsnorm
  rope_base: 1000000.0
  ffn_type: moe
  moe:
    n_experts: 8
    expert_dim: 384
    top_k: 2
    shared_experts: 0

train:
  epochs: 15
  batch_size: 32
  learning_rate: 3.0e-4
  weight_decay: 0.01
  warmup_steps: 1000
  grad_clip: 1.0
  fp16: true
  label_smoothing: 0.1
  # ---- v4: NO pretrain init (v3 showed it causes early instability) ----
  init_from_pretrain: null
  optimizer: muon
  muon_lr: 0.01
  muon_momentum: 0.95
  ns_steps: 5
  qk_clip_every: 50
  qk_clip_tau_init: 8.0
  qk_clip_tau_final: 1.0
  # ---- SOTA stack ----
  adamuon_beta: 0.99
  normuon_enabled: true
  early_stopping_patience: 4
  class_weights: true
  focal_gamma: 2.0
  ema_decay: 0.999
  entropy_weight: 0.01

eval:
  v0.1.0_max_der: 0.12
  v0.5.0_max_der: 0.08
  v1.0.0_max_der: 0.06
