# rababa_arabic_pro_dsv4 — Arabic Pro + DeepSeek-V4-Flash Tier 1 techniques.
#
# Identical to rababa_arabic_pro (baseline v0.6.0) except enables:
#   - SwiGLU Clamping (DS-V4-Flash §4.2.3): swiglu_clamp_max=10.0
#   - Attention Sink (DS-V4-Flash §2.3.3, Eq. 27): use_sink=true
#   - Sqrt(Softplus) MoE affinity (DS-V4-Flash §2.1): affinity_type=sqrt_softplus
#   - Hybrid Newton-Schulz (DS-V4-Flash §2.4): ns_steps=10 (8 aggressive + 2 stable)
#
# Saves to /checkpoints/rababa_arabic_pro_dsv4/ + metrics-arabic_pro_dsv4-train.jsonl
# so we can A/B against rababa_arabic_pro (baseline).

name: rababa_arabic_pro_dsv4
description: Arabic diacritization (Pro) + DS-V4-Flash Tier 1 techniques (A/B variant).
kind: rababa
tier: 1

data:
  module: tashkeela
  cleaner: arabic
  root: /datasets/arabic-combined

model:
  arch: modern
  dim: 512
  layers: 6
  heads: 8
  ff_dim: 2048
  dropout: 0.1
  max_len: 256
  batch_size: 32
  with_seg_head: true
  # ---- v0.6.0 Qwen3 stack (same as baseline) ----
  kv_heads: 2
  qk_norm: true
  norm_type: rmsnorm
  rope_base: 1000000.0
  ffn_type: moe
  moe:
    n_experts: 16
    expert_dim: 512
    top_k: 2
    shared_experts: 0
    # ---- DS-V4-Flash §2.1: Sqrt(Softplus) MoE affinity ----
    affinity_type: sqrt_softplus
  # ---- DS-V4-Flash §4.2.3: SwiGLU Clamping ----
  swiglu_clamp_max: 10.0
  # ---- DS-V4-Flash §2.3.3, Eq. 27: Attention Sink ----
  use_sink: true

train:
  epochs: 20
  batch_size: 16
  learning_rate: 3.0e-4
  weight_decay: 0.01
  warmup_steps: 1000
  grad_clip: 1.0
  fp16: true
  label_smoothing: 0.1
  init_from_pretrain: null
  optimizer: muon
  muon_lr: 0.02
  muon_momentum: 0.95
  # ---- DS-V4-Flash §2.4: Hybrid Newton-Schulz (10 steps = 8 aggressive + 2 stable) ----
  ns_steps: 10
  qk_clip_every: 50
  qk_clip_tau_init: 8.0
  qk_clip_tau_final: 1.0

eval:
  v0.5.0_max_der: 0.04
  v1.0.0_max_der: 0.025
  v1.5.0_max_der: 0.018
