# rababa_hebrew_resformer_reg — Hebrew + ResFormer + stronger regularization.
#
# Hypothesis: rababa_hebrew_resformer overfits Hebrew (train_loss 1.57 vs
# val_loss 6.48 — 4.9 gap). Hebrew is small (~29K train pairs), so the
# added capacity from DS-V4 + ResFormer hurts generalization.
#
# This variant tests if stronger regularization unlocks ResFormer's gain:
#   - dropout: 0.1 → 0.3 (3x stronger)
#   - weight_decay: 0.01 → 0.05 (5x stronger)
#   - label_smoothing: 0.1 → 0.2 (2x stronger)
#   - resformer.lambda1: 5.0 → 1.0 (less aggressive V_1 contribution)
#   - spectral_cap: 1.2 → 1.0 (tighter cap on update magnitude)
#
# If this beats rababa_hebrew_resformer on val_loss, regularization is the key.
# If not, the DS-V4 + ResFormer stack simply doesn't help on Hebrew's scale.

name: rababa_hebrew_resformer_reg
description: Hebrew + ResFormer + stronger regularization (small-data ablation).
kind: rababa_hebrew
tier: 1

data:
  module: nakdimon
  cleaner: hebrew
  max_len: 200

model:
  arch: modern_multi_head
  dim: 384
  layers: 6
  heads: 6
  ff_dim: 1536
  dropout: 0.3  # 3x stronger than baseline 0.1
  max_len: 512
  batch_size: 32
  head_sizes: [16, 3, 4]
  kv_heads: 2
  qk_norm: true
  norm_type: rmsnorm
  rope_base: 1000000.0
  ffn_type: moe
  moe:
    n_experts: 8
    expert_dim: 384
    top_k: 2
    shared_experts: 0
    affinity_type: sqrt_softplus
  swiglu_clamp_max: 10.0
  use_sink: true
  # ---- ResFormer with milder λ_1 (1.0 instead of 5.0) ----
  resformer:
    mode: sparse
    n_last_layers: 2
    lambda1: 1.0
    lambda2: 1.0

train:
  epochs: 15
  batch_size: 32
  learning_rate: 3.0e-4
  weight_decay: 0.05  # 5x stronger than baseline 0.01
  warmup_steps: 500
  grad_clip: 1.0
  fp16: true
  label_smoothing: 0.2  # 2x stronger than baseline 0.1
  init_from_pretrain: null
  optimizer: muon
  muon_lr: 0.02
  muon_momentum: 0.95
  ns_steps: 10
  qk_clip_every: 50
  qk_clip_tau_init: 8.0
  qk_clip_tau_final: 1.0
  spectral_cap: 1.0  # tighter cap
  heavy_tail_alpha: 0.05

eval:
  v0.1.0_max_der: 0.12
  v0.5.0_max_der: 0.08
  v1.0.0_max_der: 0.06
