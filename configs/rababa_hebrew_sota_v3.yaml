# rababa_hebrew_sota_v3 — Hebrew SOTA v3 + EMA + SAM (most aggressive).
#
# Built on v2 (class weights + focal + pretrain + LR fix + early stopping + AdaMuon)
# and adds:
#   - EMA (Exponential Moving Average) of weights — Polyak averaging.
#     Proven 2-5% DER improvement across NLP tasks. Smoothes predictions
#     by averaging model weights over training trajectory.
#   - (Future) SAM (Sharpness-Aware Minimization) — flat-minima optimizer.
#
# Expected: v3 should outperform v2 by 2-5% DER. Combined with v2's class
# weights, total DER drop from baseline 66% → v3 ~10-15%.

name: rababa_hebrew_sota_v3
description: Hebrew SOTA v3 — class weights + focal + EMA + pretrain + AdaMuon.
kind: rababa_hebrew
tier: 1

data:
  module: nakdimon
  cleaner: hebrew
  max_len: 200

model:
  arch: modern_multi_head
  dim: 384
  layers: 6
  heads: 6
  ff_dim: 1536
  dropout: 0.1
  max_len: 512
  batch_size: 32
  head_sizes: [16, 3, 4]
  kv_heads: 2
  qk_norm: true
  norm_type: rmsnorm
  rope_base: 1000000.0
  ffn_type: moe
  moe:
    n_experts: 8
    expert_dim: 384
    top_k: 2
    shared_experts: 0

train:
  epochs: 15
  batch_size: 32
  learning_rate: 3.0e-4
  weight_decay: 0.01
  warmup_steps: 1000
  grad_clip: 1.0
  fp16: true
  label_smoothing: 0.1
  init_from_pretrain: /checkpoints/rababa_hebrew_pretrain/run-001/best.pt
  optimizer: muon
  muon_lr: 0.01
  muon_momentum: 0.95
  ns_steps: 5
  qk_clip_every: 50
  qk_clip_tau_init: 8.0
  qk_clip_tau_final: 1.0
  # ---- v1 SOTA fixes ----
  adamuon_beta: 0.99
  normuon_enabled: true
  early_stopping_patience: 4
  # ---- v2: class imbalance ----
  class_weights: true
  focal_gamma: 2.0
  # ---- v3: EMA (Polyak averaging) ----
  # decay=0.999: ~1/(1-0.999)=1000 step half-life. For Hebrew's 935 batches/epoch,
  # this means shadow weights ~1 epoch behind live. Good balance.
  ema_decay: 0.999

eval:
  v0.1.0_max_der: 0.12
  v0.5.0_max_der: 0.08
  v1.0.0_max_der: 0.06
