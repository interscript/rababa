# rababa_hebrew_sota — Hebrew diacritization tuned for SOTA DER.
#
# Root causes of baseline failures:
#   1. **DER 66%** (target 6%) — main blocker. Caused by NOT using pretrain
#      init (`init_from_pretrain: null` in baseline). The Hebrew MLM pretrain
#      checkpoint exists at /checkpoints/rababa_hebrew_pretrain/run-001/best.pt
#      but was being ignored. niqqud head was predicting majority class.
#   2. **val_loss drift** 3.36 → 5.0 over 15 epochs. Caused by muon_lr=0.02
#      being too high for Hebrew's 29K-pair dataset.
#
# SOTA fixes:
#   - init_from_pretrain: /checkpoints/rababa_hebrew_pretrain/run-001/best.pt
#     (was null — root cause of 66% DER).
#   - muon_lr: 0.02 → 0.01 (fix for val_loss drift).
#   - warmup_steps: 500 → 1000 (smoother LR ramp).
#   - early_stopping_patience: 4 (lock in best epoch).
#   - AdaMuon + NorMuon (best optimizer variants from Hebrew A/B).
#
# Expected: DER ≤ 6% (v1.0.0 target), best val_loss ≤ 3.0.

name: rababa_hebrew_sota
description: Hebrew diacritization — SOTA-tuned (lower LR + early stopping + AdaMuon).
kind: rababa_hebrew
tier: 1

data:
  module: nakdimon
  cleaner: hebrew
  max_len: 200

model:
  arch: modern_multi_head
  dim: 384
  layers: 6
  heads: 6
  ff_dim: 1536
  dropout: 0.1
  max_len: 512
  batch_size: 32
  head_sizes: [16, 3, 4]
  kv_heads: 2
  qk_norm: true
  norm_type: rmsnorm
  rope_base: 1000000.0
  ffn_type: moe
  moe:
    n_experts: 8
    expert_dim: 384
    top_k: 2
    shared_experts: 0

train:
  epochs: 15
  batch_size: 32
  learning_rate: 3.0e-4
  weight_decay: 0.01
  warmup_steps: 1000  # 2x baseline — smoother LR ramp
  grad_clip: 1.0
  fp16: true
  label_smoothing: 0.1
  init_from_pretrain: /checkpoints/rababa_hebrew_pretrain/run-001/best.pt
  optimizer: muon
  muon_lr: 0.01  # halve baseline 0.02 — fix for val_loss drift
  muon_momentum: 0.95
  ns_steps: 5
  qk_clip_every: 50
  qk_clip_tau_init: 8.0
  qk_clip_tau_final: 1.0
  # ---- AdaMuon + NorMuon: best optimizer-side improvements ----
  adamuon_beta: 0.99
  normuon_enabled: true
  # ---- Early stopping: lock in best epoch, prevent drift ----
  early_stopping_patience: 4

eval:
  v0.1.0_max_der: 0.12
  v0.5.0_max_der: 0.08
  v1.0.0_max_der: 0.06
