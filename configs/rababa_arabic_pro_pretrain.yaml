# rababa_arabic_pro_pretrain — MLM pretraining for the Pro encoder.
#
# Same width/depth as rababa_arabic_pro. Pretrain on the combined Arabic
# corpus (Tashkeela-full + Sadeed HF + QCRI) — ~80M words when all three
# sources are present, much larger than arwiki alone.

name: rababa_arabic_pro_pretrain
description: Arabic char-level MLM pretraining (Pro, ~113M params, K3/DS4 stack).
kind: rababa_mlm

data:
  module: tashkeela
  cleaner: arabic
  # Use the combined corpus (built by fetch_data for rababa_arabic_pro).
  # Falls back gracefully if Sadeed HF token isn't set (GPLv2 Tashkeela
  # alone is ~27M words which is still solid for char-level MLM).
  root: /datasets/arabic-combined
  mask_prob: 0.15
  max_len: 512

model:
  arch: modern
  dim: 512
  layers: 6
  heads: 8
  ff_dim: 2048
  dropout: 0.1
  max_len: 256
  batch_size: 32
  # ---- v0.6.0 Qwen3 stack (matches supervised config) ----
  kv_heads: 2
  qk_norm: true
  norm_type: rmsnorm
  rope_base: 1000000.0
  ffn_type: moe
  moe:
    n_experts: 16
    expert_dim: 512
    top_k: 2
    shared_experts: 0

train:
  epochs: 6
  batch_size: 16
  learning_rate: 3.0e-4
  weight_decay: 0.01
  warmup_steps: 1000
  grad_clip: 1.0
  fp16: true
  optimizer: muon
  muon_lr: 0.02
  muon_momentum: 0.95
  ns_steps: 5
  scheduler: cosine
  # Pretrain objective: MTP (DeepSeek V4) — predicts N tokens per position.
  # ~1.5x more sample-efficient than MLM at the cost of an extra head.
  pretrain_method: mtp
  mtp_n_predict: 2

eval:
  v0.1.0_max_val_loss: 2.3
