# rababa_hebrew_adamuon — Ablation: AdaMuon + NorMuon (no DS-V4, no ResFormer).
#
# Purpose: isolate AdaMuon + NorMuon's contribution to the optimizer stack.
# Baseline (rababa_hebrew) uses plain Muon. This config swaps in AdaMuon +
# NorMuon on top of baseline — no architectural changes.
#
# Compare against:
#   - rababa_hebrew (baseline): plain Muon + Qwen3 stack.
#   - rababa_hebrew_resformer: everything (DS-V4 + ResFormer + all Muon variants).
#
# If rababa_hebrew_adamuon > rababa_hebrew, the Muon variants alone provide gains.

name: rababa_hebrew_adamuon
description: Hebrew diacritization + AdaMuon + NorMuon ablation.
kind: rababa_hebrew
tier: 1

data:
  module: nakdimon
  cleaner: hebrew
  max_len: 200

model:
  arch: modern_multi_head
  dim: 384
  layers: 6
  heads: 6
  ff_dim: 1536
  dropout: 0.1
  max_len: 512
  batch_size: 32
  head_sizes: [16, 3, 4]
  kv_heads: 2
  qk_norm: true
  norm_type: rmsnorm
  rope_base: 1000000.0
  ffn_type: moe
  moe:
    n_experts: 8
    expert_dim: 384
    top_k: 2
    shared_experts: 0

train:
  epochs: 15
  batch_size: 32
  learning_rate: 3.0e-4
  weight_decay: 0.01
  warmup_steps: 500
  grad_clip: 1.0
  fp16: true
  label_smoothing: 0.1
  init_from_pretrain: null
  optimizer: muon
  muon_lr: 0.02
  muon_momentum: 0.95
  ns_steps: 5
  qk_clip_every: 50
  qk_clip_tau_init: 8.0
  qk_clip_tau_final: 1.0
  # ---- AdaMuon (arXiv:2507.11005) ----
  # β_2 = 0.99 for second-moment EMA (Adam-style).
  adamuon_beta: 0.99
  # ---- NorMuon (arXiv:2510.05491) ----
  # Neuron-wise adaptive scaling on orthogonalized updates.
  normuon_enabled: true

eval:
  v0.1.0_max_der: 0.12
  v0.5.0_max_der: 0.08
  v1.0.0_max_der: 0.06
