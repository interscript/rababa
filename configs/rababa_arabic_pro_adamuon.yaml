# rababa_arabic_pro_adamuon — Arabic Pro + AdaMuon + NorMuon (no architectural changes).
#
# Empirical evidence from Hebrew: optimizer-side improvements (AdaMuon+NorMuon)
# are the most promising 2026 technique for our small char-level models.
# Architectural changes (DS-V4, ResFormer) consistently hurt by adding capacity.
#
# This config applies AdaMuon+NorMuon to the Arabic Pro baseline (no DS-V4,
# no ResFormer, no Spectral Cap, no HTMuon — just optimizer improvements).
# Expected: better than baseline, less overfitting than DS-V4/ResFormer stack.
#
# Compare against:
#   - rababa_arabic_pro (baseline): plain Muon.
#   - rababa_arabic_pro_dsv4: DS-V4 Tier 1 (hurts).
#   - rababa_arabic_pro_resformer: full stack (also hurts).

name: rababa_arabic_pro_adamuon
description: Arabic Pro + AdaMuon + NorMuon ablation (no architectural changes).
kind: rababa
tier: 1

data:
  module: tashkeela
  cleaner: arabic
  root: /datasets/arabic-combined

model:
  arch: modern
  dim: 512
  layers: 6
  heads: 8
  ff_dim: 2048
  dropout: 0.1
  max_len: 256
  batch_size: 32
  with_seg_head: true
  # ---- Same Qwen3 stack as baseline (no architectural changes) ----
  kv_heads: 2
  qk_norm: true
  norm_type: rmsnorm
  rope_base: 1000000.0
  ffn_type: moe
  moe:
    n_experts: 16
    expert_dim: 512
    top_k: 2
    shared_experts: 0

train:
  epochs: 20
  batch_size: 16
  learning_rate: 3.0e-4
  weight_decay: 0.01
  warmup_steps: 1000
  grad_clip: 1.0
  fp16: true
  label_smoothing: 0.1
  init_from_pretrain: null
  optimizer: muon
  muon_lr: 0.02
  muon_momentum: 0.95
  ns_steps: 5
  qk_clip_every: 50
  qk_clip_tau_init: 8.0
  qk_clip_tau_final: 1.0
  # ---- AdaMuon (arXiv:2507.11005) ----
  adamuon_beta: 0.99
  # ---- NorMuon (arXiv:2510.05491) ----
  normuon_enabled: true
  # ---- Early stopping: prevent overfitting drift ----
  # Hebrew baseline drifts from 3.36 → 5.0 over 15 epochs. Patience=4
  # would have stopped at epoch 8 (best 3.32). Same pattern likely on Arabic.
  early_stopping_patience: 4

eval:
  v0.5.0_max_der: 0.04
  v1.0.0_max_der: 0.025
  v1.5.0_max_der: 0.018
