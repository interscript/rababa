# rababa_hebrew_sota_v2 — Hebrew SOTA v2 with class imbalance fixes.
#
# v1 SOTA addressed: pretrain init, LR, early stopping, AdaMuon.
# v2 adds: class-weighted CE + focal loss for niqqud head.
#
# Root cause analysis updated:
#   - Hebrew baseline DER = 66% (target 6%) — 10x off.
#   - Per-head DER: niqqud=65% (16 classes, imbalanced), dagesh=15%, sin=17%.
#   - Model predicts majority class for niqqud → high accuracy on common class,
#     0% on rare classes → low val_loss but terrible DER.
#   - This is CLASS IMBALANCE, not capacity or optimization.
#
# v2 fixes:
#   - class_weights: true (compute inverse-frequency weights from training data).
#   - focal_gamma: 2.0 (focus on hard examples, standard for imbalanced).
#   - Keep all v1 fixes: pretrain init, lower LR, early stopping, AdaMuon.
#
# Expected: DER ≤ 15% (huge improvement from 66%), val_loss may increase
# (class-weighted loss is harder) but DER will drop.

name: rababa_hebrew_sota_v2
description: Hebrew SOTA v2 — class-weighted CE + focal loss + v1 fixes.
kind: rababa_hebrew
tier: 1

data:
  module: nakdimon
  cleaner: hebrew
  max_len: 200

model:
  arch: modern_multi_head
  dim: 384
  layers: 6
  heads: 6
  ff_dim: 1536
  dropout: 0.1
  max_len: 512
  batch_size: 32
  head_sizes: [16, 3, 4]
  kv_heads: 2
  qk_norm: true
  norm_type: rmsnorm
  rope_base: 1000000.0
  ffn_type: moe
  moe:
    n_experts: 8
    expert_dim: 384
    top_k: 2
    shared_experts: 0

train:
  epochs: 15
  batch_size: 32
  learning_rate: 3.0e-4
  weight_decay: 0.01
  warmup_steps: 1000
  grad_clip: 1.0
  fp16: true
  label_smoothing: 0.1
  init_from_pretrain: /checkpoints/rababa_hebrew_pretrain/run-001/best.pt
  optimizer: muon
  muon_lr: 0.01
  muon_momentum: 0.95
  ns_steps: 5
  qk_clip_every: 50
  qk_clip_tau_init: 8.0
  qk_clip_tau_final: 1.0
  # ---- v1 SOTA fixes ----
  adamuon_beta: 0.99
  normuon_enabled: true
  early_stopping_patience: 4
  # ---- v2: class imbalance fixes ----
  class_weights: true
  focal_gamma: 2.0

eval:
  v0.1.0_max_der: 0.12
  v0.5.0_max_der: 0.08
  v1.0.0_max_der: 0.06
