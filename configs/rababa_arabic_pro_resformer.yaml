# rababa_arabic_pro_resformer — Arabic Pro + ResFormer + DS-V4-Flash + Muon variants.
#
# Built on rababa_arabic_pro_dsv4 (DS-V4 Tier 1) + adds:
#   - ResFormer (arXiv:2410.17897, ACL 2025): value residual V_n = λ_1·V_1 + λ_2·V_n.
#   - Spectral Cap Muon (2026): NaN explosion prevention.
#   - HTMuon (arXiv:2603.10067, ACL 2026): heavy-tail correction.
#
# Saves to /checkpoints/rababa_arabic_pro_resformer/ + metrics-arabic_pro_resformer-train.jsonl
# so we can A/B against rababa_arabic_pro (baseline) and rababa_arabic_pro_dsv4.

name: rababa_arabic_pro_resformer
description: Arabic diacritization (Pro) + ResFormer + DS-V4-Flash + Muon variants (A/B variant).
kind: rababa
tier: 1

data:
  module: tashkeela
  cleaner: arabic
  root: /datasets/arabic-combined

model:
  arch: modern
  dim: 512
  layers: 6
  heads: 8
  ff_dim: 2048
  dropout: 0.1
  max_len: 256
  batch_size: 32
  with_seg_head: true
  # ---- v0.6.0 Qwen3 stack (same as baseline) ----
  kv_heads: 2
  qk_norm: true
  norm_type: rmsnorm
  rope_base: 1000000.0
  ffn_type: moe
  moe:
    n_experts: 16
    expert_dim: 512
    top_k: 2
    shared_experts: 0
    # ---- DS-V4-Flash §2.1: Sqrt(Softplus) MoE affinity ----
    affinity_type: sqrt_softplus
  # ---- DS-V4-Flash §4.2.3: SwiGLU Clamping ----
  swiglu_clamp_max: 10.0
  # ---- DS-V4-Flash §2.3.3, Eq. 27: Attention Sink ----
  use_sink: true
  # ---- ResFormer (arXiv:2410.17897, ACL 2025) ----
  # Sparse mode: last 2 of 6 layers receive V_1 with λ_1=5.0.
  resformer:
    mode: sparse
    n_last_layers: 2
    lambda1: 5.0
    lambda2: 1.0

train:
  epochs: 20
  batch_size: 16
  learning_rate: 3.0e-4
  weight_decay: 0.01
  warmup_steps: 1000
  grad_clip: 1.0
  fp16: true
  label_smoothing: 0.1
  init_from_pretrain: null
  optimizer: muon
  muon_lr: 0.02
  muon_momentum: 0.95
  # ---- DS-V4-Flash §2.4: Hybrid Newton-Schulz ----
  ns_steps: 10
  qk_clip_every: 50
  qk_clip_tau_init: 8.0
  qk_clip_tau_final: 1.0
  # ---- Spectral Cap Muon (2026) ----
  spectral_cap: 1.2
  # ---- HTMuon (arXiv:2603.10067) ----
  # Arabic has 75M words (vs Hebrew's smaller dataset) — slightly higher α.
  heavy_tail_alpha: 0.08

eval:
  v0.5.0_max_der: 0.04
  v1.0.0_max_der: 0.025
  v1.5.0_max_der: 0.018
